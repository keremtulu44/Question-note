name: Android CI

# İki iş:
# - test: PR, main/etiket push ve [apk] isteklerinde salt-okunur token ile çalışır;
#   imza secret'ı YOK. Kanıt artifact + step summary.
# - release: yalnız test geçerse build/imza. Main/etiket için resmî yayın, açıkça
#   [apk] istenmiş dal için yalnız önizleme; main raporu yalnız main'e yazılır.

on:
  push:
    # Her dal: PR akışına ek olarak, commit mesajında [apk] geçen dallarda imzalı
    # önizleme APK'sı üretilir (aşağıdaki release işinin koşuluna bakın).
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - 'tools/junit_ozeti.py'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/junit_ozeti.py'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      yayin:
        description: 'APK nereye gitsin? (yok = yalnız artefakt)'
        type: choice
        options:
          - onizleme
          - yok
        default: onizleme

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Testler (Debug + Release)
    # Branch pushes without an explicit APK request already get the PR test job.
    if: >-
      github.event_name != 'push' || github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Depoyu al
        uses: actions/checkout@v5

      - name: Temurin JDK 17'i kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Debug ve Release birim testlerini çalıştır
        id: testler
        shell: bash
        env:
          WRAPPER_VERSION: "9.8.1"
        run: |
          set +e
          set -o pipefail
          wrapper_log="$RUNNER_TEMP/wrapper-bootstrap.log"
          test_log="$RUNNER_TEMP/android-unit-tests.log"
          release_test_log="$RUNNER_TEMP/android-release-unit-tests.log"
          gradle_info="$RUNNER_TEMP/gradle-version.txt"
          wrapper_exit=0
          unit_test_exit=125
          release_test_exit=125
          release_test_summary="Release JUnit sonucu henüz yok"
          unit_test_summary="JUnit sonucu henüz yok"
          unit_test_failure_details="JUnit hata ayrıntısı henüz yok"

          gradle --version > "$gradle_info" 2>&1

          if [[ ! -f gradle/wrapper/gradle-wrapper.jar || ! -f gradle/wrapper/gradle-wrapper.properties ]]; then
            bootstrap_dir="$RUNNER_TEMP/gradle-wrapper-bootstrap"
            mkdir -p "$bootstrap_dir"
            printf '// Temporary project used only to generate the official Gradle wrapper.\n' > "$bootstrap_dir/build.gradle"
            (cd "$bootstrap_dir" && gradle wrapper --gradle-version "$WRAPPER_VERSION" --distribution-type bin) > "$wrapper_log" 2>&1
            wrapper_exit=$?
            if [[ "$wrapper_exit" -eq 0 ]]; then
              mkdir -p gradle/wrapper
              cp "$bootstrap_dir/gradlew" ./gradlew && \
                cp "$bootstrap_dir/gradlew.bat" ./gradlew.bat && \
                cp "$bootstrap_dir/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar && \
                cp "$bootstrap_dir/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/gradle-wrapper.properties
              wrapper_exit=$?
              if [[ "$wrapper_exit" -eq 0 ]]; then chmod +x ./gradlew; fi
            fi
          fi

          if [[ "$wrapper_exit" -eq 0 ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --console=plain --stacktrace :app:testDebugUnitTest > "$test_log" 2>&1
            unit_test_exit=$?
            unit_test_summary=$(python3 tools/junit_ozeti.py summary app/build/test-results/testDebugUnitTest \
              --require-class com.keremtulu.questionnote.ui.OneridenOdagaAkisTest \
              --require-class com.keremtulu.questionnote.ui.P5P6ArayuzTest \
              --require-class com.keremtulu.questionnote.ui.IlerlemeSadelikTest \
              --require-class com.keremtulu.questionnote.ui.IlerlemeGorselOnizlemeTest \
              --require-class com.keremtulu.questionnote.ui.P6GorselOnizlemeTest \
              --require-class com.keremtulu.questionnote.data.gelisim.AnalizPerformansTest)
            test_summary_exit=$?
            if [[ "$unit_test_exit" -eq 0 && "$test_summary_exit" -ne 0 ]]; then
              unit_test_exit=1
            fi
            if [[ "$unit_test_exit" -eq 0 ]]; then
              for name in overview-light overview-dark overview-empty overview-error overview-large weekly collection ranks; do
                if [[ ! -s "app/build/outputs/progress-previews/$name.png" ]]; then
                  echo "ERROR: Güncel İlerleme önizlemesi eksik: $name" >> "$test_log"
                  unit_test_exit=1
                fi
              done
            fi
            # İki bağımsız kapı da çalışır; Debug başarısız olsa bile Release sonucu görülür.
            ./gradlew --no-daemon --console=plain --stacktrace :app:testReleaseUnitTest > "$release_test_log" 2>&1
            release_test_exit=$?
            release_test_summary=$(python3 tools/junit_ozeti.py summary app/build/test-results/testReleaseUnitTest \
              --require-class com.keremtulu.questionnote.data.gelisim.AnalizPerformansTest \
              --require-class com.keremtulu.questionnote.data.gelisim.MotorTaniHizmetiTest \
              --require-class com.keremtulu.questionnote.data.export.YerelYedeklemeHizmetiTest)
            release_summary_exit=$?
            if [[ "$release_test_exit" -eq 0 && "$release_summary_exit" -ne 0 ]]; then release_test_exit=1; fi
            unit_test_failure_details=$(python3 tools/junit_ozeti.py failures app/build/test-results/testDebugUnitTest app/build/test-results/testReleaseUnitTest)
          fi

          {
            echo "## Android testleri"
            echo
            echo "- testDebugUnitTest çıkış kodu: $unit_test_exit — $unit_test_summary"
            echo "- testReleaseUnitTest çıkış kodu: $release_test_exit — $release_test_summary"
            echo
            echo '```text'
            printf '%s\n' "$unit_test_failure_details"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          kanit="$RUNNER_TEMP/test-kaniti"
          mkdir -p "$kanit/progress-previews" "$kanit/p6-previews" "$kanit/p6-benchmark" "$kanit/today-previews"
          cp "$gradle_info" "$kanit/gradle-version.txt" 2>/dev/null || true
          if [[ -f "$test_log" ]]; then cp "$test_log" "$kanit/android-unit-tests.log"; fi
          if [[ -f "$release_test_log" ]]; then cp "$release_test_log" "$kanit/android-release-unit-tests.log"; fi
          printf '%s' "$unit_test_summary" > "$kanit/unit-test-summary.txt"
          printf '%s' "$release_test_summary" > "$kanit/release-test-summary.txt"
          printf '%s' "$unit_test_failure_details" > "$kanit/junit-failures.txt"
          printf '%s' "$wrapper_exit" > "$kanit/wrapper-exit.txt"
          printf '%s' "$unit_test_exit" > "$kanit/unit-test-exit.txt"
          printf '%s' "$release_test_exit" > "$kanit/release-test-exit.txt"
          cp app/build/outputs/progress-previews/*.png "$kanit/progress-previews/" 2>/dev/null || true
          cp app/build/outputs/p6-previews/*.png "$kanit/p6-previews/" 2>/dev/null || true
          cp app/build/outputs/today-previews/*.png "$kanit/today-previews/" 2>/dev/null || true
          cp app/build/outputs/p6-benchmark/*.md "$kanit/p6-benchmark/" 2>/dev/null || true
          if [[ -d app/schemas ]]; then
            mkdir -p "$kanit/schemas"
            cp -r app/schemas/. "$kanit/schemas/"
          fi

          # Kısaltılmış hata tanısı annotation olarak da basılır: log/artifact
          # indirilemeyen ortamlarda (ör. kısıtlı ağ) API üzerinden okunabilir.
          if [[ "$wrapper_exit" -ne 0 || "$unit_test_exit" -ne 0 || "$release_test_exit" -ne 0 ]]; then
            {
              grep -h -o 'message="[^"]*"' app/build/test-results/testDebugUnitTest/*.xml app/build/test-results/testReleaseUnitTest/*.xml 2>/dev/null | sed 's/^message="//; s/"$//' | head -n 4 || true
              grep -h -m 4 -Ei '(^e: |error:|FAILED|AssertionError)' "$test_log" "$release_test_log" 2>/dev/null || true
              printf '%s\n' "$unit_test_failure_details" | head -n 2
            } | head -n 10 | while IFS= read -r satir; do
              temiz=$(printf '%s' "$satir" | tr -d '\r' | sed 's/%/%25/g')
              echo "::error title=Test hatasi::${temiz:0:240}"
            done
          fi

          echo "wrapper_exit=$wrapper_exit" >> "$GITHUB_OUTPUT"
          echo "unit_test_exit=$unit_test_exit" >> "$GITHUB_OUTPUT"
          echo "release_test_exit=$release_test_exit" >> "$GITHUB_OUTPUT"

      - name: Test kanıtını artifact olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-kaniti
          path: ${{ runner.temp }}/test-kaniti/**
          if-no-files-found: warn
          retention-days: 14

      - name: Test başarısızsa işi kırmızıya çevir
        if: steps.testler.outputs.wrapper_exit != '0' || steps.testler.outputs.unit_test_exit != '0' || steps.testler.outputs.release_test_exit != '0'
        run: exit 1

  release:
    name: Release (derle + imzala + yayımla)
    needs: test
    # Elle tetikleme (workflow_dispatch) herhangi bir dalda çalışabilir: imzalı APK üretir.
    # Bu yol resmî sürüm etiketi oluşturmaz; en fazla "preview-<sürüm>" önizlemesini günceller.
    # Resmî sürüm yalnız main/etiketten çıkar. Bir dal commit'i için imzalı APK istendiğinde
    # commit mesajına [apk] yazılır: APK üretilir ama yalnız "preview-<sürüm>" önizlemesine
    # yüklenir; sürüm etiketi oluşturulmaz, sürüm numarası uydurulmaz.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         startsWith(github.ref, 'refs/tags/v') ||
         contains(github.event.head_commit.message, '[apk]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Depoyu al
        uses: actions/checkout@v5

      - name: Temurin JDK 17'i kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Test kanıtını indir
        uses: actions/download-artifact@v4
        with:
          name: test-kaniti
          path: ${{ runner.temp }}/test-kaniti

      - name: Derle, imzala ve yayımla
        id: release
        shell: bash
        env:
          # Ana dal/etiket yayımları normal akışı izler; etiketler sürüm kapılıdır.
          PUBLISH_RELEASE: "true"
          YAYIN_KANALI_GIRDISI: ${{ inputs.yayin }}
          WRAPPER_VERSION: "9.8.1"
          BUILD_TOOLS_VERSION: "37.0.0"
          EXPECTED_FINGERPRINT: "FA:13:DE:D7:3C:B4:6E:DE:9E:36:37:47:EE:38:95:F2:B6:37:14:9C:16:57:90:A2:E4:67:78:F1:30:89:DE:54"
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set -o pipefail
          mkdir -p docs
          kanit="$RUNNER_TEMP/test-kaniti"
          wrapper_log="$RUNNER_TEMP/wrapper-bootstrap.log"
          test_log="$kanit/android-unit-tests.log"
          release_test_log="$kanit/android-release-unit-tests.log"
          build_log="$RUNNER_TEMP/android-build.log"
          sign_log="$RUNNER_TEMP/android-sign.log"
          verify_log="$RUNNER_TEMP/android-verify.log"
          release_log="$RUNNER_TEMP/github-release.log"
          gradle_info="$kanit/gradle-version.txt"
          apk_info="$RUNNER_TEMP/apk-info.txt"
          wrapper_exit=$(cat "$kanit/wrapper-exit.txt" 2>/dev/null || echo 0)
          unit_test_exit=$(cat "$kanit/unit-test-exit.txt" 2>/dev/null || echo 125)
          release_test_exit=$(cat "$kanit/release-test-exit.txt" 2>/dev/null || echo 125)
          unit_test_summary=$(cat "$kanit/unit-test-summary.txt" 2>/dev/null || echo "JUnit özeti bulunamadı")
          release_test_summary=$(cat "$kanit/release-test-summary.txt" 2>/dev/null || echo "Release JUnit özeti bulunamadı")
          unit_test_failure_details=$(cat "$kanit/junit-failures.txt" 2>/dev/null || echo "JUnit hata ayrıntısı bulunamadı")
          if [[ ! -s "$gradle_info" ]]; then gradle --version > "$gradle_info" 2>&1; fi
          build_exit=125
          signing_exit=125
          zipalign_exit=125
          apksigner_exit=125
          verify_exit=125
          fingerprint_exit=125
          release_exit=125
          signing_result="İmzalama henüz çalıştırılmadı"
          release_result="Yayımlanmadı"
          release_url=""
          apk_sha256="bulunamadı"
          actual_fingerprint_hex=""
          actual_fingerprint_display="bulunamadı"
          fingerprint_status="doğrulanmadı"
          version_name=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          version_code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)
          # Yayın kanalı: main/etiket push'u resmî sürüm, elle tetikleme yalnız önizleme/artefakt.
          if [[ "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]; then
            # Manual runs never publish an official release, including from main.
            if [[ "${YAYIN_KANALI_GIRDISI:-onizleme}" == "yok" ]]; then yayin_kanali="yok"; else yayin_kanali="onizleme"; fi
          elif [[ "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ "$PUBLISH_RELEASE" == "true" ]]; then yayin_kanali="surum"; else yayin_kanali="yok"; fi
          else
            # Dal commit'i ([apk] işareti): yalnız önizleme APK'sı.
            yayin_kanali="onizleme"
          fi
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed_apk="app/build/outputs/apk/release/yanlis-defteri-${version_name}.apk"
          keystore_file="$RUNNER_TEMP/yanlisdefteri.p12"
          aligned_apk="$RUNNER_TEMP/yanlisdefteri-aligned.apk"
          expected_fingerprint_hex=$(printf '%s' "$EXPECTED_FINGERPRINT" | tr -cd '[:xdigit:]' | tr '[:lower:]' '[:upper:]')

          if [[ -n "${SIGNING_KEYSTORE_BASE64:-}" && -n "${SIGNING_PASSWORD:-}" ]]; then
            secret_status="İki gerekli secret dolu (değerler gösterilmez)"
          else
            secret_status="Eksik veya boş secret var (değerler gösterilmez)"
          fi

          if [[ ! -x ./gradlew ]]; then chmod +x ./gradlew 2>/dev/null || true; fi
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar || ! -f gradle/wrapper/gradle-wrapper.properties ]]; then
            bootstrap_dir="$RUNNER_TEMP/gradle-wrapper-bootstrap"
            mkdir -p "$bootstrap_dir"
            printf '// Temporary project used only to generate the official Gradle wrapper.\n' > "$bootstrap_dir/build.gradle"
            (cd "$bootstrap_dir" && gradle wrapper --gradle-version "$WRAPPER_VERSION" --distribution-type bin) > "$wrapper_log" 2>&1
            wrapper_exit=$?
            if [[ "$wrapper_exit" -eq 0 ]]; then
              mkdir -p gradle/wrapper
              cp "$bootstrap_dir/gradlew" ./gradlew && \
                cp "$bootstrap_dir/gradlew.bat" ./gradlew.bat && \
                cp "$bootstrap_dir/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar && \
                cp "$bootstrap_dir/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/gradle-wrapper.properties
              wrapper_exit=$?
              if [[ "$wrapper_exit" -eq 0 ]]; then chmod +x ./gradlew; fi
            fi
          fi

          # needs: test, iki test kapısının da geçtiğini garanti eder.
          if [[ "$wrapper_exit" -eq 0 ]]; then
            ./gradlew --no-daemon --console=plain --stacktrace :app:assembleRelease > "$build_log" 2>&1
            build_exit=$?
          else
            printf '%s\n' "assembleRelease, Gradle wrapper hazırlanamadığı için çalıştırılmadı." > "$build_log"
          fi

          if [[ "$build_exit" -eq 0 && -f "$unsigned_apk" ]]; then
            if [[ -z "${SIGNING_KEYSTORE_BASE64:-}" || -z "${SIGNING_PASSWORD:-}" ]]; then
              signing_exit=2
              signing_result="Gerekli secret'lardan en az biri eksik veya boş"
              printf '%s\n' "SIGNING_KEYSTORE_BASE64 ve SIGNING_PASSWORD gereklidir; değerler rapora yazılmadı." > "$sign_log"
            else
              signing_result="İmzalama adımı başarısız"
              printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore_file" 2> "$sign_log"
              decode_exit=$?
              if [[ "$decode_exit" -ne 0 || ! -s "$keystore_file" ]]; then
                signing_exit=3
                signing_result="Keystore secret çözülemedi"
                printf '%s\n' "Base64 keystore çözülemedi veya boş çıktı verdi." >> "$sign_log"
              else
                build_tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
                if [[ ! -x "$build_tools/zipalign" || ! -x "$build_tools/apksigner" ]]; then
                  signing_exit=4
                  signing_result="İmzalama araçları bulunamadı"
                  printf 'zipalign/apksigner bulunamadı: %s\n' "$build_tools" >> "$sign_log"
                else
                  "$build_tools/zipalign" -p -f 4 "$unsigned_apk" "$aligned_apk" >> "$sign_log" 2>&1
                  zipalign_exit=$?
                  if [[ "$zipalign_exit" -eq 0 ]]; then
                    "$build_tools/apksigner" sign \
                      --ks "$keystore_file" \
                      --ks-key-alias yanlisdefteri \
                      --ks-pass env:SIGNING_PASSWORD \
                      --key-pass env:SIGNING_PASSWORD \
                      --out "$signed_apk" \
                      "$aligned_apk" >> "$sign_log" 2>&1
                    apksigner_exit=$?
                  fi
                  if [[ "$apksigner_exit" -eq 0 ]]; then
                    "$build_tools/apksigner" verify --verbose --print-certs "$signed_apk" > "$verify_log" 2>&1
                    verify_exit=$?
                    fingerprint_raw=$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' "$verify_log")
                    actual_fingerprint_hex=$(printf '%s' "$fingerprint_raw" | tr -cd '[:xdigit:]' | tr '[:lower:]' '[:upper:]')
                    if [[ -n "$actual_fingerprint_hex" ]]; then
                      actual_fingerprint_display=$(printf '%s' "$actual_fingerprint_hex" | sed 's/../&:/g; s/:$//')
                    fi
                    if [[ "$verify_exit" -eq 0 && "$actual_fingerprint_hex" == "$expected_fingerprint_hex" ]]; then
                      fingerprint_exit=0
                      fingerprint_status="eşleşti"
                      signing_exit=0
                      signing_result="İmzalandı; apksigner doğruladı ve beklenen sertifika eşleşti"
                    else
                      fingerprint_exit=1
                      fingerprint_status="eşleşmedi veya okunamadı"
                      signing_exit=1
                      signing_result="İmza doğrulaması veya parmak izi kontrolü başarısız"
                    fi
                  else
                    signing_exit=1
                    if [[ "$zipalign_exit" -eq 0 ]]; then
                      signing_result="APK imzalanamadı"
                    else
                      signing_result="APK zipalign edilemedi"
                    fi
                  fi
                fi
              fi
            fi
          elif [[ "$build_exit" -eq 0 ]]; then
            build_exit=1
            printf '%s\n' "assembleRelease başarılı döndü fakat beklenen imzasız APK bulunamadı: $unsigned_apk" > "$build_log"
          fi

          rm -f "$keystore_file" "$aligned_apk"

          if [[ "$signing_exit" -eq 0 ]]; then
            apk_sha256=$(sha256sum "$signed_apk" | awk '{print $1}')
            printf '%s\n' "APK: $signed_apk" "SHA-256: $apk_sha256" > "$apk_info"
            tag="v${version_name}"
            notes_file="$RUNNER_TEMP/release-notes.md"
            {
              echo "Yanlış Defterim ${version_name} (${version_code})"
              echo
              echo "- Derlenen commit: ${GITHUB_SHA}"
              echo "- Debug testleri: ${unit_test_summary}"
              echo "- Release ortak testleri: ${release_test_summary} (ortak testler ikinci kez çalışır; sayılar toplanmaz)"
              echo "- Varsayılan gölge mod: v2 tarihleri korunur. Etkin v3 gerçek cihaz/gölge kabulü tamamlanana kadar kapalıdır."
              echo "- Fiziksel cihaz, TalkBack, SAF ve frame-p95 kabulü henüz yapılmadı."
              echo "- APK SHA-256: ${apk_sha256}"
              echo "- Sertifika SHA-256: ${actual_fingerprint_display}"
            } > "$notes_file"

            if [[ "$yayin_kanali" == "yok" ]]; then
              release_exit=0
              release_result="Ara doğrulama başarılı; yayın kapısı kapalı, Release oluşturulmadı"
              printf '%s\n' "$release_result" > "$release_log"
            elif [[ "$yayin_kanali" == "onizleme" ]] || gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              # Sürüm etiketi çoktan yayımlandı: uygulamanın adı/sürümü değiştirilmez, yeni bir
              # sürüm numarası uydurulmaz. Bu derlemenin imzalı APK'sı yine de indirilebilsin diye
              # sabit bir "preview-<sürüm>" etiketine (prerelease) yüklenir; her koşuda üzerine yazılır.
              onizleme_tag="preview-${version_name}"
              if gh release view "$onizleme_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                gh release upload "$onizleme_tag" "$signed_apk" --clobber --repo "$GITHUB_REPOSITORY" > "$release_log" 2>&1
                release_exit=$?
                release_result="Sürüm etiketi mevcut; önizleme APK'sı güncellendi"
              else
                gh release create "$onizleme_tag" \
                  --repo "$GITHUB_REPOSITORY" \
                  --target "$GITHUB_SHA" \
                  --title "Yanlış Defterim ${version_name} · önizleme derlemesi" \
                  --prerelease \
                  --notes-file "$notes_file" \
                  "$signed_apk" > "$release_log" 2>&1
                release_exit=$?
                release_result="Sürüm etiketi mevcut; önizleme derlemesi oluşturuldu"
              fi
              if [[ "$release_exit" -eq 0 ]]; then
                release_url=$(gh release view "$onizleme_tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url 2>/dev/null)
              else
                release_result="Önizleme APK'sı yüklenemedi"
                printf '%s\n' "$release_result" >> "$release_log"
              fi
            else
              gh release create "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "Yanlış Defterim ${version_name}" \
                --notes-file "$notes_file" \
                "$signed_apk" > "$release_log" 2>&1
              release_exit=$?
              if [[ "$release_exit" -eq 0 ]]; then
                release_result="Release oluşturuldu"
                release_url=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url 2>/dev/null)
              else
                release_result="Release oluşturulamadı"
              fi
            fi
          fi

          if [[ "$wrapper_exit" -eq 0 && "$unit_test_exit" -eq 0 && "$release_test_exit" -eq 0 && "$build_exit" -eq 0 && "$signing_exit" -eq 0 && "$fingerprint_exit" -eq 0 && "$release_exit" -eq 0 ]]; then
            overall="BAŞARILI"
          else
            overall="BAŞARISIZ"
          fi

          {
            echo "# CI Android Derleme, İmza ve Release Raporu"
            echo
            echo "> Bu dosya Android CI tarafından otomatik üretilir. Keystore veya parola değerleri yazılmaz."
            echo
            echo "- Zaman (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Workflow commit'i: $GITHUB_SHA"
            echo "- Dal: $GITHUB_REF_NAME"
            echo "- Uygulama sürümü: ${version_name:-bilinmiyor} (versionCode ${version_code:-bilinmiyor})"
            echo "- Android SDK: compileSdk/targetSdk 37, minSdk 26; build-tools $BUILD_TOOLS_VERSION"
            echo "- Genel sonuç: **$overall**"
            echo "- Wrapper çıkış kodu: $wrapper_exit"
            echo "- testDebugUnitTest çıkış kodu: $unit_test_exit"
            echo "- Birim test özeti (Debug): $unit_test_summary"
            echo "- testReleaseUnitTest çıkış kodu: $release_test_exit"
            echo "- Birim test özeti (Release ortak testler): $release_test_summary"
            echo "- UI/Preview regresyonları yalnız testDebug; ortak testler iki varyantta çalışır, sayılar toplanmaz."
            echo "- assembleRelease çıkış kodu: $build_exit"
            echo "- İmzalama secret durumu: $secret_status"
            echo "- İmzalama/verify durumu: $signing_result (kod: $signing_exit; apksigner verify: $verify_exit)"
            echo "- Sertifika parmak izi: $actual_fingerprint_display (beklenen: $EXPECTED_FINGERPRINT; durum: $fingerprint_status)"
            echo "- Yayın kanalı: $yayin_kanali (elle tetikleme sürüm etiketi oluşturmaz)"
            echo "- Release: $release_result (kod: $release_exit)"
            echo "- Release URL: ${release_url:-yok}"
            echo "- İmzalı APK SHA-256: $apk_sha256"
            echo
            echo "## Gradle sürümü"
            echo
            echo '```text'
            cat "$gradle_info"
            echo '```'
            echo
            echo "## Birim test çıktısı (hata özeti + başlangıç/son bölüm)"
            echo
            echo '```text'
            if [[ -f "$test_log" ]]; then
              echo "-- Derleyici/Gradle hata satırları --"
              grep -nEi '(^e: |error:|unresolved reference|compilation error|what went wrong|failed to)' "$test_log" | head -n 80 || true
              echo
              echo "-- İlk 100 satır --"
              head -n 100 "$test_log"
              echo
              echo "-- Son 80 satır --"
              tail -n 80 "$test_log"
            else
              echo "Birim test çıktısı (artifact) bulunamadı."
            fi
            echo '```'
            echo
            echo "## Release birim test çıktısı"
            echo
            echo '```text'
            if [[ -f "$release_test_log" ]]; then
              echo "-- İlk 90 satır (görev/konfigürasyon hataları dahil) --"
              head -n 90 "$release_test_log"
              echo "-- Hata satırları ve son bölüm --"
              grep -nEi '(^e: |error:|unresolved reference|compilation error|what went wrong|failed to)' "$release_test_log" | head -n 80 || true
              tail -n 100 "$release_test_log"
            else
              echo "Release birim test çıktısı (artifact) bulunamadı."
            fi
            echo '```'
            echo
            echo "## JUnit başarısızlık ayrıntıları"
            echo
            echo '```text'
            printf '%s\n' "$unit_test_failure_details"
            echo '```'
            echo
            echo "## Derleme çıktısı (son 120 satır)"
            echo
            echo '```text'
            if [[ -f "$build_log" ]]; then tail -n 120 "$build_log"; else echo "Derleme çalıştırılmadı."; fi
            echo '```'
            echo
            echo "## İmzalama çıktısı"
            echo
            echo '```text'
            if [[ -f "$sign_log" ]]; then tail -n 100 "$sign_log"; else echo "İmzalama başlatılmadı."; fi
            echo '```'
            echo
            echo "## Sertifika doğrulama çıktısı"
            echo
            echo '```text'
            if [[ -f "$verify_log" ]]; then cat "$verify_log"; else echo "apksigner verify çalıştırılmadı."; fi
            echo '```'
            echo
            echo "## Release çıktısı"
            echo
            echo '```text'
            if [[ -f "$release_log" ]]; then cat "$release_log"; else echo "Release oluşturulmadı."; fi
            echo '```'
            echo
            echo "## APK özeti"
            echo
            echo '```text'
            if [[ -f "$apk_info" ]]; then cat "$apk_info"; else echo "İmzalı APK yok."; fi
            echo '```'
          } > docs/DERLEME_RAPORU.md

          echo "wrapper_exit=$wrapper_exit" >> "$GITHUB_OUTPUT"
          echo "unit_test_exit=$unit_test_exit" >> "$GITHUB_OUTPUT"
          echo "release_test_exit=$release_test_exit" >> "$GITHUB_OUTPUT"
          echo "build_exit=$build_exit" >> "$GITHUB_OUTPUT"
          echo "signing_exit=$signing_exit" >> "$GITHUB_OUTPUT"
          echo "fingerprint_exit=$fingerprint_exit" >> "$GITHUB_OUTPUT"
          echo "release_exit=$release_exit" >> "$GITHUB_OUTPUT"

      - name: Derleme, imza veya Release başarısızsa işi kırmızıya çevir
        if: steps.release.outputs.build_exit != '0' || steps.release.outputs.signing_exit != '0' || steps.release.outputs.fingerprint_exit != '0' || steps.release.outputs.release_exit != '0'
        run: exit 1

      - name: İmzalı APK'yı indirilebilir artefakt olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yanlis-defteri-apk
          if-no-files-found: warn
          retention-days: 30
          path: |
            app/build/outputs/apk/release/yanlis-defteri-*.apk

      - name: Test kanıtındaki önizleme, performans ve şemaları docs'a kopyala
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          kanit="$RUNNER_TEMP/test-kaniti"
          # Small, named documentation previews only; never collect arbitrary build outputs.
          if [[ -d "$kanit/progress-previews" ]]; then
            mkdir -p docs/ui/progress
            for source in "$kanit"/progress-previews/*.png; do
              [[ -f "$source" ]] || continue
              test "$(stat -c%s "$source")" -lt 1500000
              cp "$source" "docs/ui/progress/$(basename "$source")"
            done
          fi
          if [[ -d "$kanit/p6-previews" ]]; then
            mkdir -p docs/ui/p6
            for source in "$kanit"/p6-previews/*.png; do
              [[ -f "$source" ]] || continue
              test "$(stat -c%s "$source")" -lt 1500000
              cp "$source" "docs/ui/p6/$(basename "$source")"
            done
          fi
          if [[ -d "$kanit/today-previews" ]]; then
            mkdir -p docs/ui/today
            for source in "$kanit"/today-previews/*.png; do
              [[ -f "$source" ]] || continue
              test "$(stat -c%s "$source")" -lt 1500000
              cp "$source" "docs/ui/today/$(basename "$source")"
            done
          fi
          for variant in debug release; do
            source="$kanit/p6-benchmark/$variant.md"
            if [[ -f "$source" ]]; then
              test "$(stat -c%s "$source")" -lt 100000
              cp "$source" "docs/PERFORMANS_${variant^^}.md"
            fi
          done
          if [[ -d "$kanit/schemas" ]]; then
            mkdir -p app/schemas
            cp -r "$kanit/schemas/." app/schemas/
          fi

      - name: Raporu artifact olarak sakla (etiket çalıştırmaları)
        if: always() && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: derleme-raporu
          path: docs/DERLEME_RAPORU.md
          if-no-files-found: warn
          retention-days: 30

      - name: Wrapper ve raporu main dalına yaz
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DERLEME_RAPORU.md
          if [[ -d docs/ui/progress ]]; then git add docs/ui/progress; fi
          if [[ -d docs/ui/p6 ]]; then git add docs/ui/p6; fi
          if [[ -d docs/ui/today ]]; then git add docs/ui/today; fi
          for report in docs/PERFORMANS_DEBUG.md docs/PERFORMANS_RELEASE.md; do
            if [[ -f "$report" ]]; then git add "$report"; fi
          done
          if [[ -d app/schemas ]]; then git add app/schemas; fi
          for path in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            if [[ -f "$path" ]]; then git add "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "Rapor/wrapper değişmedi; commit atlanıyor."
          else
            git commit -m "ci: save signed Android build report [skip ci]"
            # Dal, iş çalışırken ilerlemiş olabilir (elle push). Raporun kaybolmaması için
            # rebase edip yeniden dene; yine olmazsa özeti log'a bas.
            if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
              git fetch --deepen 100 || git fetch --unshallow || true
              for deneme in 1 2 3; do
                if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
                  echo "Rapor ${GITHUB_REF_NAME} dalına yazıldı (deneme ${deneme})."
                  break
                fi
                git rebase --abort || true
                sleep 5
              done
            else
              echo "Rapor ${GITHUB_REF_NAME} dalına yazıldı."
            fi
          fi
          echo "----- derleme raporu özeti -----"
          sed -n '1,20p' docs/DERLEME_RAPORU.md || true
