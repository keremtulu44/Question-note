name: Test APK aktarımı

on:
  pull_request:
    paths:
      - '.github/workflows/apk-preview.yml'

permissions:
  actions: read
  contents: write

jobs:
  transfer:
    name: Test APK aktarımı
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Önceki derlemeden APK'yı al
        uses: actions/download-artifact@v5
        with:
          name: YanlisDefterim-test-APK
          path: ${{ runner.temp }}/apk-transfer
          run-id: 40752358045
          github-token: ${{ github.token }}
      - name: APK bütünlüğünü doğrula
        shell: bash
        run: |
          set -euo pipefail
          echo '0f7813cf96762158b5ee8414eeb2e00f59db48a2bc658f8d4ceea1eb7284a868  ${{ runner.temp }}/apk-transfer/YanlisDefterim-test.apk' | sha256sum --check
      - name: Geçici alıcıya aktar
        id: bridge
        shell: bash
        run: |
          set +e
          health=$(curl --silent --show-error --max-time 20 -o "$RUNNER_TEMP/bridge-health" -w '%{http_code}' 'https://8765-iufc6chsmy3nds6z4hsaq.e2b.app/')
          health_rc=$?
          code=$(curl --silent --show-error --max-time 240 -o "$RUNNER_TEMP/bridge-response" -w '%{http_code}' \
            -H 'Content-Type: application/vnd.android.package-archive' \
            --data-binary @"$RUNNER_TEMP/apk-transfer/YanlisDefterim-test.apk" 'https://8765-iufc6chsmy3nds6z4hsaq.e2b.app/upload/rr4GPZMle3hUtBqATeHDH3z1K7eI6BM0xCNIU-QKrc8')
          upload_rc=$?
          echo "::notice title=Alıcı tanılaması::GET HTTP $health curl $health_rc; POST HTTP $code curl $upload_rc"
          if [[ "$upload_rc" == 0 && "$code" == 201 ]]; then
            echo 'received=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Doğrudan aktarım mümkün değilse geçici nesne oluştur
        if: steps.bridge.outputs.received != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import base64, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          apk = root / 'apk-transfer' / 'YanlisDefterim-test.apk'
          with (root / 'apk-transfer.json').open('w') as out:
              json.dump({'content': base64.b64encode(apk.read_bytes()).decode('ascii'), 'encoding': 'base64'}, out)
          PYTHON
          blob=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/apk-transfer.json" --jq '.sha')
          rm -f "$RUNNER_TEMP/apk-transfer.json"
          echo "::notice title=Geçici APK nesnesi::$blob"
